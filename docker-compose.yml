services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alma}
      POSTGRES_DB: ${POSTGRES_DB:-alma}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"   # exposed so a host-run API (needed for headed form-fill) can connect
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alma} -d ${POSTGRES_DB:-alma}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-alma}:${POSTGRES_PASSWORD:-alma}@db:5432/${POSTGRES_DB:-alma}
      UPLOAD_DIR: /data/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-claude-opus-4-8}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-4096}
      LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-60}
      OCR_MODE: ${OCR_MODE:-llm}
      FORM_URL: ${FORM_URL:-}
      BROWSER_HEADLESS: ${BROWSER_HEADLESS:-true}
      BROWSER_TIMEOUT_MS: ${BROWSER_TIMEOUT_MS:-30000}
    volumes:
      - uploads:/data/uploads
    ports:
      - "8000:8000"   # exposed for direct API access / Swagger at /docs

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "8080:80"

  # Browser-automation worker (stream 3). Not started by default — it carries
  # heavy Playwright/browser deps. Run with: docker compose --profile worker up
  automation:
    build:
      context: .
      dockerfile: automation/Dockerfile
    profiles: ["worker"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-alma}:${POSTGRES_PASSWORD:-alma}@db:5432/${POSTGRES_DB:-alma}
      UPLOAD_DIR: /data/uploads
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      LLM_MODEL: ${LLM_MODEL:-claude-opus-4-8}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-4096}
      LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-60}
      OCR_MODE: ${OCR_MODE:-llm}
      FORM_URL: ${FORM_URL:-}
      BROWSER_HEADLESS: ${BROWSER_HEADLESS:-true}
      BROWSER_TIMEOUT_MS: ${BROWSER_TIMEOUT_MS:-30000}
    volumes:
      - uploads:/data/uploads

volumes:
  pgdata:
  uploads:
